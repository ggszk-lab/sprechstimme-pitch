name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra notebook
      - name: Lint
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest -q
      # Executes without audio: recordings are skipped, but the metadata
      # asserts and every code path up to the empty-run guards must pass.
      - name: Execute paper-reproduction notebook (no-audio mode)
        run: >
          uv run jupyter nbconvert --to notebook --execute --stdout
          notebooks/02_paper_reproduction.ipynb > /dev/null
