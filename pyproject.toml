[project]
name = "sprechstimme-pitch"
version = "0.1.0"
description = "Three-axis (register/range/contour) analysis of Sprechstimme in Schoenberg's Pierrot lunaire op.21"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Gen Suzuki", email = "gen@ggszk.org" },
]
keywords = ["music-information-retrieval", "pitch-analysis", "sprechstimme", "schoenberg", "pyin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "librosa>=0.11",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "soundfile>=0.13",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.0",
    "jupyterlab>=4.0",
    "nbconvert>=7.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/ggszk-lab/sprechstimme-pitch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprechstimme_pitch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
